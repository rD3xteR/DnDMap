name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
      
    - name: Publish
      run: dotnet publish --configuration Release --no-build --output publish --self-contained false
      
    - name: Create Installer
      run: |
        # Установка Squirrel.Windows
        dotnet add package Squirrel.Windows --version 2.0.1
        # Сборка установщика
        .\build-installer.ps1 -Version ${{ github.ref_name }}
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Installer
        path: Setup/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Setup/DnDMap-Setup.exe