name: Android APK

on:
  workflow_dispatch:
  push:
    # Любая ветка: APK нужен и в рабочих ветках, а не только в master.
    branches:
      - '**'
    paths:
      - 'src/DnDMap.Android/**'
      - 'src/DnDMap.Core/**'
      - 'src/DnDMap.Server/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # На образе ubuntu-latest несколько cmdline-tools; берём первый найденный.
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # Постоянный ключ подписи: без него каждый прогон подписывает APK новым debug-ключом
      # раннера, и Android не даёт поставить новую версию поверх старой.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 secret (see README, Android host)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dndmap.jks"
          ls -l "$RUNNER_TEMP/dndmap.jks"

      # Debug-сборка сохраняет отладочную информацию, но подписывается постоянным ключом
      # из секретов, поэтому обновления ставятся поверх без удаления приложения.
      - name: Build APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dotnet build src/DnDMap.Android/DnDMap.Android.csproj -c Debug \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/dndmap.jks" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"

      # Страховка от Fast Deployment: если managed-сборки не попали в APK,
      # установленное вручную приложение падает с "No assemblies found ... .__override__".
      # Формат зависит от версии/конфигурации: в .NET 10 Debug с EmbedAssembliesIntoApk
      # это lib/<abi>/lib_<Assembly>.dll.so, в других вариантах — assembly store
      # (lib/<abi>/libassembly-store.so или libassemblies.<abi>.blob.so) либо assemblies/.
      - name: Verify APK is self-contained
        run: |
          set -euo pipefail
          OUT=src/DnDMap.Android/bin/Debug/net10.0-android
          echo "--- contents of $OUT ---"
          ls -la "$OUT"
          APK="$(ls "$OUT"/*-Signed.apk 2>/dev/null | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Signed APK not found in $OUT"; exit 1
          fi
          echo "--- APK: $APK ($(du -h "$APK" | cut -f1)) ---"
          LIST="$RUNNER_TEMP/apk-entries.txt"
          unzip -l "$APK" > "$LIST"
          echo "entries: $(wc -l < "$LIST")"
          echo "--- assembly entries ---"
          grep -E "assemblies|assembly-store|/lib_[^/]*\.dll\.so" "$LIST" | head -n 20 || true
          grep -Eq "lib/[^/]*/lib_DnDMap\.Android\.dll\.so|lib/[^/]*/libassembly-store\.so|lib/[^/]*/libassemblies[^/]*\.so|assemblies/|assemblies\.blob" "$LIST" || {
            echo "--- lib/ entries (first 40) ---"
            grep " lib/" "$LIST" | head -n 40 || true
            echo "::error::APK does not embed managed assemblies (fast deployment)"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DnDMap-android-${{ github.run_number }}
          path: src/DnDMap.Android/bin/Debug/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
