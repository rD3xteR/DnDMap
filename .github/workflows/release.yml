name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required so action-gh-release can create/update the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project targets net10.0-windows7.0; SDK 8 could not build it.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = '0.0.0-dev'
          }
          Write-Host "Version: $v"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup already present: $iscc"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Build, publish and create installer
        shell: pwsh
        run: .\build-installer.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DnDMap-Setup-${{ steps.version.outputs.version }}
          path: Setup/DnDMap-Setup.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Setup/DnDMap-Setup.exe
